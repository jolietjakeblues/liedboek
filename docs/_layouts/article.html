---
layout: default
---

<article class="article">
  <header class="article-header">
    <h1>{{ page.title }}</h1>
    {% if page.artist and page.artist != "" %}
      <p class="article-artist">{{ page.artist }}</p>
    {% endif %}
    {% if page.intro and page.intro != "" %}
      <p class="article-intro">{{ page.intro }}</p>
    {% endif %}
  </header>

  <div class="article-body">
    {{ content }}
  </div>

  <p class="back"><a href="{{ site.baseurl }}/over-liedjes/">← Over liedjes</a></p>
</article>
